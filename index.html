
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Script Copier</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 12px 23px;
    background: #0b0d12;
    color: #f1f3f9;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    font-size: 27px;
    margin: 0 0 8px;
}

.subtitle {
    color: #8d95a7;
    font-size: 14px;
    margin-bottom: 30px;
}

.script-card {
    position: relative;
    background: #11141c;
    border: 1px solid #292e3c;
    border-radius: 12px;
    margin-bottom: 18px;
    overflow: hidden;
}

.card-header {
    min-height: 61px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid #292e3c;
}

.script-name {
    font-size: 14px;
    font-weight: 700;
}

.copy-button {
    background: #e9e8ff;
    color: #24204f;
    border: none;
    border-radius: 9px;
    padding: 10px 17px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
}

.copy-button:hover:not(:disabled) {
    background: #c9c5ff;
}

.copy-button:active:not(:disabled) {
    transform: scale(0.97);
}

.script-content {
    display: block;
    width: 100%;
    min-height: 155px;
    padding: 19px;
    background: transparent;
    color: #c8d2e4;
    border: none;
    outline: none;
    resize: vertical;
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre;
    overflow: auto;
}

/* Locked script card */
.script-card.locked {
    border-color: #766024;
    padding-bottom: 42px;
    cursor: pointer;
}

.script-card.locked .card-header,
.script-card.locked .script-content {
    filter: blur(6px);
    pointer-events: none;
    user-select: none;
}

.script-card.locked .script-content {
    resize: none;
    min-height: 155px;
}

.script-card.locked .copy-button {
    cursor: not-allowed;
}

.script-card.locked:focus-visible {
    outline: 2px solid #ffd76a;
    outline-offset: 3px;
}

/* Yellow Locked badge */
.locked-badge {
    position: absolute;
    right: 12px;
    bottom: 10px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    background: #332b14;
    border: 1px solid #766024;
    border-radius: 7px;
    color: #ffd76a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
    box-shadow: 0 2px 8px #0003;
}

/* Popup background */
.modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(3, 5, 10, 0.78);
    backdrop-filter: blur(5px);
}

.modal-backdrop.open {
    display: flex;
}

/* Popup window */
.locked-modal {
    width: min(100%, 430px);
    padding: 25px;
    background: #11141c;
    border: 1px solid #766024;
    border-radius: 14px;
    box-shadow: 0 20px 70px rgba(0, 0, 0, 0.5);
    animation: modal-in 160ms ease-out;
}

.locked-modal h2 {
    margin: 0 0 12px;
    color: #ffd76a;
    font-size: 21px;
}

.locked-modal p {
    margin: 0;
    color: #c8d2e4;
    font-size: 14px;
    line-height: 1.65;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 22px;
}

.modal-close {
    padding: 9px 16px;
    border: 1px solid #766024;
    border-radius: 8px;
    background: #332b14;
    color: #ffd76a;
    font-weight: 700;
    cursor: pointer;
}

.modal-close:hover {
    background: #443819;
}

.footer {
    text-align: center;
    color: #687184;
    font-size: 12px;
    margin: 28px 0 10px;
}

@keyframes modal-in {
    from {
        opacity: 0;
        transform: translateY(6px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@media (max-width: 520px) {
    body {
        padding: 20px 12px;
    }

    h1 {
        font-size: 23px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .locked-modal {
        animation: none;
    }
}
</style>
</head>

<body>
<div class="container">

    <h1>Roblox Script Copier</h1>

    <div class="subtitle">
        Your scripts, all in one place.
    </div>

    <main id="script-list"></main>

    <div class="footer">
        Roblox Script Copier · Personal Collection
    </div>

</div>

<!-- Locked script popup -->
<div
    class="modal-backdrop"
    id="locked-modal-backdrop"
    aria-hidden="true"
>
    <section
        class="locked-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="locked-modal-title"
        aria-describedby="locked-modal-message"
    >
        <h2 id="locked-modal-title">🔒 Locked Script</h2>

        <p id="locked-modal-message">
            Ce script est verrouillé pour l'instant veuillez contactez ou faire un ticket pour avoir le script directement.
        </p>

        <div class="modal-actions">
            <button
                class="modal-close"
                id="locked-modal-close"
                type="button"
            >
                Fermer
            </button>
        </div>
    </section>
</div>

<script>
// ========================================
// WEBSITE OWNER SETTINGS
// Edit your script names and code here.
// The third script is automatically locked.
// ========================================

const scripts = [
    {
        name: "Xeiola HUB",
        code: `loadstring(game:HttpGet("https://raw.githubusercontent.com/ljjdwawdwd/StreetLifeMain/refs/heads/main/Slr.lua"))()`
    },
    {
        name: "Aurora HUB",
        code: `loadstring(game:HttpGet("https://raw.githubusercontent.com/Aurora-Script/Script/refs/heads/main/ScriptSb"))()`
    },
    {
        name: "OP HUB",
        code: `loadstring(game:HttpGet("https://pastebin.com/raw/GW6h1s1U"))()`
    }
];

const list = document.getElementById("script-list");
const backdrop = document.getElementById("locked-modal-backdrop");
const closeButton = document.getElementById("locked-modal-close");

let previouslyFocused = null;

function openLockedModal() {
    previouslyFocused = document.activeElement;
    backdrop.classList.add("open");
    backdrop.setAttribute("aria-hidden", "false");
    closeButton.focus();
}

function closeLockedModal() {
    backdrop.classList.remove("open");
    backdrop.setAttribute("aria-hidden", "true");

    if (previouslyFocused) {
        previouslyFocused.focus();
    }
}

// Close popup with button
closeButton.addEventListener("click", closeLockedModal);

// Close popup by clicking outside it
backdrop.addEventListener("click", (event) => {
    if (event.target === backdrop) {
        closeLockedModal();
    }
});

// Close popup with Escape
document.addEventListener("keydown", (event) => {
    if (
        event.key === "Escape" &&
        backdrop.classList.contains("open")
    ) {
        closeLockedModal();
    }
});

// Build script cards
scripts.forEach((script, index) => {
    const isLocked = index === 2;

    const card = document.createElement("section");
    card.className = "script-card";

    if (isLocked) {
        card.classList.add("locked");
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute(
            "aria-label",
            "Locked Script — click for details"
        );

        card.addEventListener("click", (event) => {
            // Do not trigger the popup from the disabled copy button.
            if (event.target.closest(".copy-button")) {
                return;
            }

            openLockedModal();
        });

        card.addEventListener("keydown", (event) => {
            if (event.target !== card) return;

            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openLockedModal();
            }
        });
    }

    // Card header
    const header = document.createElement("div");
    header.className = "card-header";

    const name = document.createElement("div");
    name.className = "script-name";
    name.textContent = script.name;

    // Copy button
    const copy = document.createElement("button");
    copy.className = "copy-button";
    copy.textContent = "Copier";
    copy.type = "button";
    copy.disabled = isLocked;

    copy.addEventListener("click", async () => {
        if (isLocked) return;

        try {
            await navigator.clipboard.writeText(script.code);
            copy.textContent = "Copié ✓";
        } catch {
            const temp = document.createElement("textarea");
            temp.value = script.code;
            temp.style.position = "fixed";
            temp.style.opacity = "0";

            document.body.appendChild(temp);
            temp.select();

            const success = document.execCommand("copy");
            temp.remove();

            copy.textContent = success
                ? "Copié ✓"
                : "Erreur";
        }

        setTimeout(() => {
            copy.textContent = "Copier";
        }, 1500);
    });

    header.append(name, copy);

    // Read-only script content
    const content = document.createElement("textarea");
    content.className = "script-content";
    content.value = script.code;
    content.readOnly = true;
    content.spellcheck = false;
    content.rows = 7;
    content.setAttribute("aria-label", script.name);

    card.append(header, content);

    // Yellow Locked badge
    if (isLocked) {
        const badge = document.createElement("div");
        badge.className = "locked-badge";

        const keyIcon = document.createElement("span");
        keyIcon.textContent = "🔑";
        keyIcon.setAttribute("aria-hidden", "true");

        const label = document.createElement("span");
        label.textContent = "Locked";

        badge.append(keyIcon, label);
        card.appendChild(badge);
    }

    list.appendChild(card);
});
</script>

</body>
</html>
